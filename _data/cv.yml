        start_date: 2024-10
        end_date: present
        highlights:
          - "Focus: process design and simulation, control engineering, scale-up and cost estimation, polymer and reaction engineering"

      - institution: TU Dortmund University
        location: Dortmund, Germany
        area: Studies before transferring to the master's programme at TH Köln
        studyType: ""
