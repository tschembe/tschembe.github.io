  sections:
    Profile:
      - bullet: "Master's student in Process Engineering at TH Köln with a focus on process design, process simulation and control. Project experience along the whole chain: balances and reactor design, scale-up and cost estimation, dynamic simulation in AVEVA, CHEMCAD and MATLAB, and data-driven modelling in Python. I validate models against literature or measured data first, close the balances and document results so others can follow them."

